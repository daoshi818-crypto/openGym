name: Build signed APK

on:
  push:
    branches: [main]
  schedule:
    # Daily at 09:30 Beijing time (UTC 01:30)
    - cron: '30 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Zurich
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --maxWorkers=2
        working-directory: frontend
      - run: npx vitest run src/App.startup.test.jsx --maxWorkers=2
        working-directory: frontend
        env:
          VITE_MOBILE: "1"
      - run: node scripts/check-locales.mjs && node scripts/check-source-strings.mjs --strict
        working-directory: frontend
      - run: npm ci --omit=optional
        working-directory: api
      # GitHub runners are non-root Linux: POSIX credential/directory permissions are real.
      - run: npm test
        working-directory: api
      - run: npm ci
      - run: node scripts/build-coach-assets.mjs --check && node scripts/build-api-docs.mjs --check && node api/scripts/check-core-loadable.mjs

  build:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build, sign and checksum
        env:
          OPENGYM_KS: ${{ secrets.OPENGYM_KS }}
        run: bash .github/scripts/ci-build.sh

      - name: Verify companion watch package
        run: node .github/scripts/verify-watch-packages.cjs

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: openGym custom v${{ env.APP_VERSION }}
          body_path: docs/dev/RELEASE_1_6_35.zh-CN.md
          files: |
            openGym.apk
            openGym.apk.sha256
            watch-app/releases/opengym-watch-${{ env.WATCH_VERSION }}.rpk
            watch-app/releases/opengym-watch-${{ env.WATCH_VERSION }}.rpk.sha256
            watch-app/releases/opengym-watch-round-${{ env.WATCH_ROUND_VERSION }}.rpk
            watch-app/releases/opengym-watch-round-${{ env.WATCH_ROUND_VERSION }}.rpk.sha256
            watch-app/releases/targets.json
          make_latest: true

      - name: Publish update metadata with the release
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          set -euo pipefail
          cat > update.json <<EOF
          {
            "tag_name": "v${APP_VERSION}",
            "apk_url": "https://github.com/daoshi818-crypto/openGym/releases/download/v${APP_VERSION}/openGym.apk",
            "hash_url": "https://github.com/daoshi818-crypto/openGym/releases/download/v${APP_VERSION}/openGym.apk.sha256"
          }
          EOF
          git config user.email "actions@users.noreply.github.com"
          git config user.name "openGym release builder"
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json already points at v${APP_VERSION}"
          else
            git commit -m "chore: publish update metadata for v${APP_VERSION} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Purge jsDelivr update metadata
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/daoshi818-crypto/openGym@main/update.json" || true
          sleep 10
          hour=$(( $(date +%s) / 3600 ))
          body=$(curl -fsS "https://cdn.jsdelivr.net/gh/daoshi818-crypto/openGym@main/update.json?og=$hour" || true)
          if echo "$body" | grep -q "v${APP_VERSION}"; then
            echo "CDN update check finds v${APP_VERSION}"
          else
            echo "::warning::CDN metadata is still cached. New clients also check origin metadata; older clients need CDN propagation."
          fi
