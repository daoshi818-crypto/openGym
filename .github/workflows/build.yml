name: Build signed APK

on:
  schedule:
    # 北京时间每天 09:30（UTC 01:30），检查官方是否有新版本
    - cron: '30 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream and rebase fork commits
        run: |
          git remote add upstream https://github.com/DuarteSantos8/openGym.git
          git fetch upstream main
          git config user.email "actions@users.noreply.github.com"
          git config user.name "openGym fork builder"
          git rebase upstream/main

      - name: Skip if this version is already released
        id: guard
        run: |
          VER=$(node -p "require('./frontend/package.json').version")
          OURS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name // empty')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "v$VER" = "$OURS" ]; then
            echo "v$VER already released — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Build mobile bundle
        if: steps.guard.outputs.skip != 'true'
        working-directory: frontend
        run: |
          npm ci
          VITE_MOBILE=1 npx vite build
          node ../scripts/catalogue/stage-media.mjs dist
          npx cap sync
          node scripts/check-mobile-bundle.mjs

      - name: Build release APK
        if: steps.guard.outputs.skip != 'true'
        working-directory: frontend/android
        run: ./gradlew assembleRelease --console=plain

      - name: Zipalign and sign (v1+v2+v3)
        if: steps.guard.outputs.skip != 'true'
        env:
          KS_B64: ${{ secrets.OPENGYM_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.OPENGYM_KEYSTORE_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > /tmp/opengym.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign \
            --ks /tmp/opengym.keystore --ks-key-alias opengym \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out openGym.apk aligned.apk
          "$BT/apksigner" verify --print-certs -v openGym.apk | grep -E "Verified using" || true
          sha256sum openGym.apk | cut -d' ' -f1 > openGym.apk.sha256

      - name: Push rebased main (keep fork source in sync with the published APK)
        if: steps.guard.outputs.skip != 'true'
        run: git push origin main --force-with-lease

      - name: Publish release
        if: steps.guard.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.guard.outputs.version }}
          name: openGym 定制版 v${{ steps.guard.outputs.version }}
          body: |
            自动构建：官方 v${{ steps.guard.outputs.version }} + 本地定制（默认简体中文等）。

            本 APK 使用个人签名，与官方 release 的签名不同——请通过本仓库的应用内
            「检查更新」或直接下载本文件安装，不要安装官方 release 覆盖本版本。
          files: openGym.apk openGym.apk.sha256
          make_latest: true
