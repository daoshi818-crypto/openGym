name: Build signed APK

on:
  schedule:
    # Daily at 09:30 Beijing time (UTC 01:30)
    - cron: '30 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream and rebase fork commits
        run: |
          git remote add upstream https://github.com/DuarteSantos8/openGym.git
          git fetch upstream main
          git config user.email "actions@users.noreply.github.com"
          git config user.name "openGym fork builder"
          git rebase upstream/main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build, sign and checksum
        env:
          OPENGYM_KS: ${{ secrets.OPENGYM_KS }}
        run: bash .github/scripts/ci-build.sh

      - name: Push rebased main
        run: git push origin main --force-with-lease

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: openGym custom v${{ env.APP_VERSION }}
          body: |
            Auto-built from upstream main plus local customisations (Simplified Chinese by default,
            domestic exercise names). Signed with a personal key: do not install the official
            release over this build.
          files: openGym.apk openGym.apk.sha256
          make_latest: true
