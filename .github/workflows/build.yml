name: Build signed APK

on:
  push:
    branches: [main]
  schedule:
    # Daily at 09:30 Beijing time (UTC 01:30)
    - cron: '30 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream and rebase fork commits
        if: github.event_name != 'push'
        run: |
          git remote add upstream https://github.com/DuarteSantos8/openGym.git
          git fetch upstream main
          git config user.email "actions@users.noreply.github.com"
          git config user.name "openGym fork builder"
          git rebase upstream/main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build, sign and checksum
        env:
          OPENGYM_KS: ${{ secrets.OPENGYM_KS }}
        run: bash .github/scripts/ci-build.sh

      - name: Verify companion watch package
        run: |
          set -euo pipefail
          WATCH_VERSION=$(node -p "require('./watch-app/src/manifest.json').versionName")
          for WATCH_TARGET in watch-square watch-round; do
            if [ "$WATCH_TARGET" = watch-square ]; then WATCH_RPK="watch-app/releases/opengym-watch-${WATCH_VERSION}.rpk"; else WATCH_RPK="watch-app/releases/opengym-watch-round-${WATCH_VERSION}.rpk"; fi
            test -f "$WATCH_RPK"
            test "$(sha256sum "$WATCH_RPK" | cut -d' ' -f1)" = "$(tr -d '\r\n' < "$WATCH_RPK.sha256")"
            WATCH_RPK="$WATCH_RPK" WATCH_TARGET="$WATCH_TARGET" node -e 'const cp=require("node:child_process");const source=require("./watch-app/src/manifest.json");const packed=JSON.parse(cp.execFileSync("unzip",["-p",process.env.WATCH_RPK,"manifest.json"],{encoding:"utf8"}));for(const key of ["package","name","versionName","versionCode"])if(source[key]!==packed[key])throw Error("Watch manifest mismatch: "+key);if(!packed.deviceTypeList.includes(process.env.WATCH_TARGET))throw Error("Watch target mismatch: "+process.env.WATCH_TARGET)'
          done
          echo "WATCH_VERSION=$WATCH_VERSION" >> "$GITHUB_ENV"

      - name: Push rebased main
        if: github.event_name != 'push'
        run: git push origin main --force-with-lease

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: openGym custom v${{ env.APP_VERSION }}
          body: |
          手机：${{ env.APP_VERSION }}；手表：${{ env.WATCH_VERSION }}。
          本版为官方 v1.4.4 的选择性合入（v1.4.3..v1.4.4，官方 peeled commit 5f5832db56080837b58342ff50f78631dcc63e07），逐条处置见 docs/dev/UPSTREAM_V1_4_4_INTEGRATION.zh-CN.md。
          新增每组备注：组号菜单可写、训练页与历史显示、CSV 增加 set_note 列（可回导）、MCP get_workout 与 Coach 载荷一并携带；沿用本仓库 500 字上限。
          新增本周剩余训练数：Home 连续卡下显示「本周还剩 X/Y」，轮换可在 设置 → 计划与日程 → 每周训练次数 设定目标。
          新增每组对比上次：完成组标 ↑/=/↓（重量优先、次数其次、冲突时用估算 1RM；辅助器械反向；保持按秒、有氧按分钟），读屏文字同步，可在 设置 → 训练 关闭。
          新增疑似笔误确认：手打勾且数值远超最好或远低于上次同组时先问一次，「我来改」保留未勾，「就按这样记录」照记；取消勾选、计时组自完成、手表打勾、辅助器械重量都不提问。
          新增 28 条界面文案：简体/繁体为正式译文，俄/乌/波三语的复数形式已补齐，其余语言暂用英文占位。
          范围：官方 iOS 内容全部未合入；Wear OS 仅保留专题文档，未新增手表工程；BlueOS 手表协议（DeviceRpc/outbox/eventId/业务 ACK/同步冲突）未改动，手表仍为 ${{ env.WATCH_VERSION }}。
          验证：前端全量 474 文件 / 5814 测试通过；API 载荷 47 项通过；18 语言键一致（各 2449 键）；本地 vite 生产构建通过。Android/手表真机验收仍需按 docs/dev/UPSTREAM_V1_4_4_INTEGRATION.zh-CN.md 第 8 节执行。
          手机 openGym.apk 沿用本仓库正式签名；vivo WATCH GT 安装 opengym-watch-${{ env.WATCH_VERSION }}.rpk，圆屏安装 opengym-watch-round-${{ env.WATCH_VERSION }}.rpk。
          files: |
            openGym.apk
            openGym.apk.sha256
            watch-app/releases/opengym-watch-${{ env.WATCH_VERSION }}.rpk
            watch-app/releases/opengym-watch-${{ env.WATCH_VERSION }}.rpk.sha256
            watch-app/releases/opengym-watch-round-${{ env.WATCH_VERSION }}.rpk
            watch-app/releases/opengym-watch-round-${{ env.WATCH_VERSION }}.rpk.sha256
          make_latest: true

      - name: Publish update metadata with the release
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          set -euo pipefail
          cat > update.json <<EOF
          {
            "tag_name": "v${APP_VERSION}",
            "apk_url": "https://github.com/daoshi818-crypto/openGym/releases/download/v${APP_VERSION}/openGym.apk",
            "hash_url": "https://github.com/daoshi818-crypto/openGym/releases/download/v${APP_VERSION}/openGym.apk.sha256"
          }
          EOF
          git config user.email "actions@users.noreply.github.com"
          git config user.name "openGym release builder"
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json already points at v${APP_VERSION}"
          else
            git commit -m "chore: publish update metadata for v${APP_VERSION} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Purge jsDelivr update metadata
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/daoshi818-crypto/openGym@main/update.json" || true
          sleep 10
          hour=$(( $(date +%s) / 3600 ))
          body=$(curl -fsS "https://cdn.jsdelivr.net/gh/daoshi818-crypto/openGym@main/update.json?og=$hour" || true)
          if echo "$body" | grep -q "v${APP_VERSION}"; then
            echo "CDN update check finds v${APP_VERSION}"
          else
            echo "::warning::CDN metadata is still cached. New clients also check origin metadata; older clients need CDN propagation."
          fi
