name: Build signed APK
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sign
        env:
          OPENGYM_KS: ${{ secrets.OPENGYM_KS }}
        run: |
          echo "${OPENGYM_KS%%::*}" | base64 -d > /tmp/opengym.keystore
          echo "keystore bytes: $(wc -c < /tmp/opengym.keystore)"

      - name: Push rebased main
        run: echo "push placeholder"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v9.9.9
          name: t
          files: openGym.apk
